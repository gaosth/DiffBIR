# Stage2训练配置 - 成对褪色图片修复
# 用于使用真实的褪色-修复图像对训练ControlNet

model:
  cldm:
    target: diffbir.model.cldm.ControlLDM
    params:
      latent_scale_factor: 0.18215
      unet_cfg:
        use_checkpoint: True
        image_size: 32 # unused
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_head_channels: 64
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False
      vae_cfg:
        embed_dim: 4
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
      clip_cfg:
        embed_dim: 1024
        vision_cfg:
          image_size: 224
          layers: 32
          width: 1280
          head_width: 80
          patch_size: 14
        text_cfg:
          context_length: 77
          vocab_size: 49408
          width: 1024
          heads: 16
          layers: 24
        layer: "penultimate"
      controlnet_cfg:
        use_checkpoint: True
        image_size: 32 # unused
        in_channels: 4
        hint_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_head_channels: 64
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False

  diffusion:
    target: diffbir.model.gaussian_diffusion.Diffusion
    params:
      linear_start: 0.00085
      linear_end: 0.0120
      timesteps: 1000
      zero_snr: False
      parameterization: eps

dataset:
  train:
    target: diffbir.dataset.paired_fading.PairedFadingDataset
    params:
      # 数据集根目录（包含ori/和fixed/子目录）
      data_root: /path/to/your/paired_data
      # CSV文件路径，包含filename和prompt
      prompt_csv: /path/to/your/image_prompts.csv
      # 输出图片尺寸
      out_size: 512
      # 裁剪类型：center, random, resize, none
      #   center - 中心裁剪（保持长宽比，裁切中心512x512）
      #   random - 随机裁剪（保持长宽比，随机位置裁切512x512）
      #   resize - 直接resize到512x512（推荐，使用完整图片内容）
      #   none - 不裁剪（要求图片已经是512x512）
      crop_type: resize
      # 褪色图片子目录名
      ori_subdir: ori
      # 修复图片子目录名
      fixed_subdir: fixed

batch_transform:
  target: diffbir.dataset.batch_transform.IdentityBatchTransform

train:
  # Stable Diffusion v2.1预训练权重路径
  # 下载地址: https://huggingface.co/stabilityai/stable-diffusion-2-1-base
  sd_path: /path/to/stable-diffusion-2-1-base/v2-1_512-ema-pruned.ckpt

  # 实验输出目录
  exp_dir: experiments/paired_fading_restoration

  # 学习率
  learning_rate: 1e-4

  # 批次大小（根据你的GPU显存调整）
  # 153张图片的小数据集，建议使用较小的batch size
  batch_size: 4

  # 数据加载workers数量
  num_workers: 4

  # 训练步数
  # 对于153张图片：
  # 153图片 / 4 batch_size ≈ 38 steps/epoch
  # 建议训练100-200 epochs，即 3800-7600 steps
  # 但为了避免过拟合，建议先尝试较少的步数
  train_steps: 5000

  # 日志记录间隔
  log_every: 50

  # checkpoint保存间隔
  ckpt_every: 1000

  # 图像记录间隔
  image_every: 200

  # 从checkpoint恢复训练（可选）
  resume: ~

  # 条件噪声增强时间步
  # 设置为0表示不使用噪声增强
  # 可以尝试50-100来增加训练的鲁棒性
  noise_aug_timestep: 0
